<script>
  (function() {
    'use strict';

    const state = {
      selectedEquipment: null,
      manual: false,
      generalServices: false,
      searchTimer: null,
      searchVersion: 0,
      areaVersion: 0,
      submitting: false
    };

    const elements = {
      form: document.getElementById('report-form'),
      equipmentControls: document.getElementById('equipment-controls'),
      location: document.getElementById('location-select'),
      area: document.getElementById('area-select'),
      areaWrap: document.getElementById('area-filter-wrap'),
      areaStatus: document.getElementById('area-status'),
      searchWrap: document.getElementById('equipment-search-wrap'),
      search: document.getElementById('equipment-search'),
      searchStatus: document.getElementById('search-status'),
      results: document.getElementById('equipment-results'),
      selected: document.getElementById('selected-equipment'),
      selectedCode: document.getElementById('selected-code'),
      selectedName: document.getElementById('selected-name'),
      selectedLocation: document.getElementById('selected-location'),
      selectedArea: document.getElementById('selected-area'),
      selectedBrand: document.getElementById('selected-brand'),
      selectedInformation: document.getElementById('selected-information'),
      changeEquipment: document.getElementById('change-equipment'),
      manualToggle: document.getElementById('manual-toggle'),
      manualFields: document.getElementById('manual-fields'),
      message: document.getElementById('form-message'),
      submit: document.getElementById('submit-button'),
      success: document.getElementById('success-view'),
      successMessage: document.getElementById('success-message'),
      newReport: document.getElementById('new-report')
    };

    function updateReportTypeDescription() {
      const descriptions = {
        MECANICO: 'Mecánico: fallas de equipos.',
        SERVICIOS_GENERALES: 'Servicios generales: paredes, pintura e instalaciones.',
        IT: 'IT: informática.'
      };
      const selected = document.querySelector('input[name="tipoReporte"]:checked');
      document.getElementById('report-type-description').textContent = selected ? descriptions[selected.value] || '' : '';
    }

    function handleReportTypeChange() {
      updateReportTypeDescription();
      const selected = document.querySelector('input[name="tipoReporte"]:checked');
      const generalServices = !!selected && selected.value === 'SERVICIOS_GENERALES';
      const leavingGeneralServices = state.generalServices && !generalServices;
      state.generalServices = generalServices;
      elements.manualToggle.hidden = generalServices;
      if ((generalServices && !state.manual) || (leavingGeneralServices && state.manual)) {
        toggleManual();
      }
    }

    function callServer(functionName) {
      const args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function(error) {
            reject(new Error(error && error.message ? error.message : String(error)));
          });
        runner[functionName].apply(runner, args);
      });
    }

    function escapeHtml(value) {
      const node = document.createElement('span');
      node.textContent = value || '';
      return node.innerHTML;
    }

    function equipmentLocation(equipment) {
      return [equipment.empresa, equipment.ubicacion, equipment.area].filter(Boolean).join(' · ');
    }

    function setLocationValue(location) {
      const expected = String(location || '');
      const option = Array.from(elements.location.options).find(function(item) {
        return item.value === expected;
      });
      if (option) elements.location.value = option.value;
    }

    function renderResults(results) {
      elements.results.innerHTML = '';
      if (!results.length) {
        elements.searchStatus.textContent = 'No se encontraron equipos.';
        elements.results.hidden = true;
        return;
      }
      elements.searchStatus.textContent = results.length + ' resultado(s).';
      elements.results.innerHTML = results.map(function(equipment) {
        return '<button class="result-button" type="button" data-code="' + escapeHtml(equipment.codigo) + '">' +
          '<strong>' + escapeHtml(equipment.nombre || 'Equipo sin nombre') + '</strong>' +
          '<span>' + escapeHtml(equipment.codigo) + '</span>' +
          '<small>Área: ' + escapeHtml(equipment.area || 'Sin área registrada') + '</small>' +
          (equipment.informacion ? '<small>' + escapeHtml(equipment.informacion) + '</small>' : '') +
          '</button>';
      }).join('');
      elements.results.hidden = false;
    }

    async function searchEquipment() {
      const version = ++state.searchVersion;
      const query = elements.search.value.trim();
      const location = elements.location.value;
      if (!location) {
        elements.searchStatus.textContent = 'Selecciona primero una ubicación.';
        return;
      }
      elements.searchStatus.textContent = 'Buscando...';
      elements.results.hidden = true;
      try {
        const results = await callServer('buscarEquiposPorUbicacion', location, query, elements.area.value);
        if (version === state.searchVersion && !state.selectedEquipment && !state.manual) renderResults(results);
      } catch (error) {
        if (version === state.searchVersion) elements.searchStatus.textContent = error.message;
      }
    }

    async function loadAreas() {
      const version = ++state.areaVersion;
      const location = elements.location.value;
      elements.area.innerHTML = '<option value="">Todas las áreas</option>';
      elements.areaWrap.hidden = !location;
      elements.area.disabled = true;
      elements.areaStatus.textContent = location ? 'Cargando áreas...' : '';
      if (!location) return;
      try {
        const areas = await callServer('obtenerAreasEquipos', location);
        if (version !== state.areaVersion) return;
        elements.area.innerHTML += areas.map(function(area) {
          return '<option value="' + escapeHtml(area) + '">' + escapeHtml(area) + '</option>';
        }).join('');
        elements.areaStatus.textContent = '';
      } catch (error) {
        if (version === state.areaVersion) elements.areaStatus.textContent = 'No se pudieron cargar las áreas. Puedes buscar por nombre o código.';
      } finally {
        if (version === state.areaVersion) elements.area.disabled = false;
      }
    }

    async function loadEmail() {
      const email = document.getElementById('email');
      const status = document.getElementById('email-status');
      try {
        const value = await callServer('obtenerCorreoUsuarioDisponible');
        if (value && !email.value) {
          email.value = value;
          status.textContent = 'Correo completado desde tu cuenta de Google. Puedes corregirlo.';
        } else {
          status.textContent = 'Correo opcional. Si no aparece, puedes escribirlo.';
        }
      } catch (error) {
        status.textContent = 'Correo opcional. Puedes escribirlo si deseas.';
      }
    }

    function selectEquipment(equipment) {
      state.searchVersion += 1;
      state.selectedEquipment = equipment;
      state.manual = false;
      elements.selectedCode.textContent = equipment.codigo;
      elements.selectedName.textContent = equipment.nombre || 'Equipo sin nombre';
      elements.selectedLocation.textContent = equipment.ubicacion || 'Sin ubicación registrada';
      elements.selectedArea.textContent = equipment.area || 'Sin área registrada';
      elements.selectedBrand.textContent = equipment.marca || 'Sin marca registrada';
      elements.selectedInformation.textContent = equipment.informacion || 'Sin información adicional';
      const changedLocation = elements.location.value !== equipment.ubicacion;
      setLocationValue(equipment.ubicacion);
      if (changedLocation) loadAreas();
      elements.selected.hidden = false;
      elements.equipmentControls.hidden = true;
      elements.results.hidden = true;
      elements.manualFields.hidden = true;
      elements.manualToggle.textContent = 'No encuentro el equipo';
    }

    function clearEquipment() {
      state.selectedEquipment = null;
      elements.selected.hidden = true;
      elements.equipmentControls.hidden = false;
      elements.searchWrap.hidden = !elements.location.value;
      elements.search.value = '';
      elements.searchStatus.textContent = '';
      if (elements.location.value) {
        searchEquipment();
        elements.search.focus();
      } else {
        elements.location.focus();
      }
    }

    function toggleManual() {
      if (state.generalServices && state.manual) return;
      window.clearTimeout(state.searchTimer);
      state.searchVersion += 1;
      elements.results.hidden = true;
      state.manual = !state.manual;
      if (state.manual) {
        state.searchVersion += 1;
        document.getElementById('manual-location').value = elements.location.value;
        document.getElementById('manual-area').value = elements.area.value;
        state.selectedEquipment = null;
        elements.selected.hidden = true;
        elements.equipmentControls.hidden = true;
        elements.manualFields.hidden = false;
        elements.manualToggle.textContent = 'Buscar un equipo registrado';
        document.getElementById('manual-name').focus();
      } else {
        elements.manualFields.hidden = true;
        elements.equipmentControls.hidden = false;
        elements.searchWrap.hidden = !elements.location.value;
        elements.manualToggle.textContent = 'No encuentro el equipo';
        elements.location.focus();
      }
    }

    function readEvidence() {
      const file = document.getElementById('evidence').files[0];
      if (!file) return Promise.resolve(null);
      if (file.size > 8 * 1024 * 1024) {
        return Promise.reject(new Error('La evidencia no puede superar 8 MB.'));
      }
      return new Promise(function(resolve, reject) {
        const reader = new FileReader();
        reader.onload = function() {
          resolve({
            name: file.name,
            mimeType: file.type,
            base64: String(reader.result).split(',')[1]
          });
        };
        reader.onerror = function() { reject(new Error('No se pudo leer la evidencia.')); };
        reader.readAsDataURL(file);
      });
    }

    function showError(message) {
      elements.message.textContent = message;
      elements.message.hidden = false;
      elements.message.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function submitReport(event) {
      event.preventDefault();
      if (state.submitting) return;
      elements.message.hidden = true;
      state.submitting = true;
      elements.submit.disabled = true;
      elements.submit.textContent = 'Enviando...';

      try {
        const equipmentStopped = document.querySelector('input[name="equipoDetenido"]:checked').value === 'SI';
        const payload = {
          tipoReporte: document.querySelector('input[name="tipoReporte"]:checked').value,
          personaReporta: document.getElementById('reporter').value,
          correoReporta: document.getElementById('email').value,
          sinEquipo: state.manual,
          codigoEquipo: state.selectedEquipment ? state.selectedEquipment.codigo : '',
          nombreEquipo: document.getElementById('manual-name').value,
          ubicacion: document.getElementById('manual-location').value,
          area: document.getElementById('manual-area').value,
          descripcion: document.getElementById('description').value,
          equipoDetenido: equipmentStopped,
          prioridad: document.getElementById('priority').value,
          evidence: await readEvidence()
        };
        const result = await callServer('crearReporte', payload);
        elements.form.hidden = true;
        elements.successMessage.textContent = result.mensaje;
        elements.success.hidden = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        showError(error.message || 'No se pudo registrar el reporte.');
      } finally {
        state.submitting = false;
        elements.submit.disabled = false;
        elements.submit.textContent = 'Enviar reporte';
      }
    }

    async function loadInitialEquipment() {
      if (state.manual) return;
      const version = state.searchVersion;
      const code = String(window.APP_INITIAL_CODE || '').trim();
      if (!code) return;
      elements.search.value = code;
      elements.searchStatus.textContent = 'Identificando equipo...';
      try {
        const equipment = await callServer('obtenerEquipoPorCodigo', code);
        if (state.manual || version !== state.searchVersion) return;
        if (equipment) {
          selectEquipment(equipment);
        } else {
          elements.searchStatus.textContent = 'El código del QR no está registrado.';
        }
      } catch (error) {
        elements.searchStatus.textContent = error.message;
      }
    }

    async function loadLocations() {
      elements.location.disabled = true;
      try {
        const locations = await callServer('obtenerUbicacionesEquipos');
        elements.location.innerHTML = '<option value="">Selecciona una ubicación</option>' +
          locations.map(function(location) {
            return '<option value="' + escapeHtml(location) + '">' + escapeHtml(location) + '</option>';
          }).join('');
      } catch (error) {
        elements.location.innerHTML = '<option value="">No se pudieron cargar</option>';
        showError(error.message);
      } finally {
        elements.location.disabled = false;
      }
    }

    elements.search.addEventListener('input', function() {
      state.searchVersion += 1;
      elements.results.hidden = true;
      window.clearTimeout(state.searchTimer);
      state.searchTimer = window.setTimeout(searchEquipment, 280);
    });
    elements.location.addEventListener('change', function() {
      state.searchVersion += 1;
      window.clearTimeout(state.searchTimer);
      state.selectedEquipment = null;
      elements.search.value = '';
      elements.results.hidden = true;
      elements.searchWrap.hidden = !elements.location.value;
      loadAreas();
      if (elements.location.value) searchEquipment();
    });
    elements.area.addEventListener('change', function() {
      window.clearTimeout(state.searchTimer);
      searchEquipment();
    });
    elements.results.addEventListener('click', async function(event) {
      const button = event.target.closest('[data-code]');
      if (!button) return;
      const version = ++state.searchVersion;
      elements.searchStatus.textContent = 'Cargando equipo...';
      try {
        const equipment = await callServer('obtenerEquipoPorCodigo', button.dataset.code);
        if (equipment && version === state.searchVersion && !state.manual) selectEquipment(equipment);
      } catch (error) {
        elements.searchStatus.textContent = error.message;
      }
    });
    elements.changeEquipment.addEventListener('click', clearEquipment);
    elements.manualToggle.addEventListener('click', toggleManual);
    elements.form.addEventListener('submit', submitReport);
    elements.newReport.addEventListener('click', function() {
      window.location.reload();
    });

    document.querySelectorAll('input[name="tipoReporte"]').forEach(function(input) {
      input.addEventListener('change', handleReportTypeChange);
    });
    handleReportTypeChange();
    loadEmail();
    loadLocations().then(loadInitialEquipment);
  })();
</script>
