<style>
  :root {
    --ink: #17130f;
    --muted: #665d54;
    --cream: #f8f3e9;
    --paper: #fffdf8;
    --line: #e7d3b8;
    --brand: #c06e32;
    --brand-dark: #965027;
    --brand-soft: #f4e3cf;
    --success: #17613b;
    --danger: #9a2d23;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(248, 243, 233, .92), rgba(248, 243, 233, .97)),
      url("https://produccionpdt.com/bello-campo-tiendas.jpg") center / 420px repeat;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .app-header {
    width: min(760px, calc(100% - 32px));
    margin: 0 auto;
    padding: 28px 0 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-logo {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: contain;
    background: #fff;
    border: 2px solid var(--line);
  }
  .eyebrow {
    margin: 0 0 2px;
    color: var(--brand-dark);
    font-size: .78rem;
    font-weight: 800;
    text-transform: uppercase;
  }
  h1 { margin: 0; font-size: 2rem; line-height: 1.08; }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-weight: 700; }
  .page-shell {
    width: min(760px, calc(100% - 32px));
    margin: 0 auto 48px;
    background: rgba(255, 253, 248, .97);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 18px 44px rgba(54, 38, 23, .12);
  }
  form { padding: 8px 28px 28px; }
  .form-section { padding: 24px 0; border-bottom: 1px solid var(--line); }
  .form-section:last-of-type { border-bottom: 0; }
  .section-heading { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
  .section-heading h2 { margin: 0; font-size: 1.18rem; }
  .section-heading p { margin: 3px 0 0; color: var(--muted); }
  .step {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    font-weight: 800;
  }
  label, legend { display: block; margin: 0 0 7px; font-weight: 800; }
  label span { color: var(--muted); font-size: .88rem; font-weight: 500; }
  input, select, textarea {
    width: 100%;
    min-height: 46px;
    border: 1px solid #d9c3a7;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    padding: 10px 12px;
    outline: none;
  }
  textarea { resize: vertical; min-height: 120px; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(192, 110, 50, .14);
  }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
  .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .report-types { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .equipment-information { grid-column: 1 / -1; }
  #selected-information { white-space: pre-wrap; }
  .segmented input:focus-visible + span { outline: 3px solid var(--brand-dark); outline-offset: 2px; }
  .segmented label { margin: 0; }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented span {
    min-height: 48px;
    display: grid;
    place-items: center;
    border: 1px solid #d9c3a7;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    font-size: 1rem;
    font-weight: 800;
  }
  .segmented input:checked + span {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .segmented-small span { min-height: 46px; }
  .field-note { min-height: 22px; margin-top: 5px; color: var(--muted); font-size: .86rem; }
  .equipment-search-wrap { margin-top: 16px; }
  .search-results {
    margin-top: 6px;
    max-height: 290px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }
  .result-button {
    width: 100%;
    padding: 11px 12px;
    display: grid;
    gap: 2px;
    border: 0;
    border-bottom: 1px solid #eee1d0;
    background: #fff;
    color: var(--ink);
    text-align: left;
  }
  .result-button:last-child { border-bottom: 0; }
  .result-button:hover, .result-button:focus { background: #fcf4e9; }
  .result-button strong { font-size: .95rem; }
  .result-button span { color: var(--brand-dark); font-size: .78rem; font-weight: 800; }
  .result-button small { color: var(--muted); font-size: .78rem; }
  .equipment-card {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    border: 1px solid var(--brand);
    border-radius: 6px;
    background: #fff9f1;
  }
  .equipment-card h3 { margin: 3px 0; font-size: 1.08rem; }
  .equipment-card p { margin: 0; color: var(--muted); }
  .equipment-code { color: var(--brand-dark); font-size: .78rem; font-weight: 900; }
  .equipment-details {
    display: grid;
    grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr);
    gap: 8px 18px;
    margin: 12px 0 0;
  }
  .equipment-details div { min-width: 0; }
  .equipment-details dt {
    color: var(--muted);
    font-size: .7rem;
    font-weight: 900;
    text-transform: uppercase;
  }
  .equipment-details dd { margin: 2px 0 0; font-weight: 800; overflow-wrap: anywhere; }
  .manual-fields { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #d9c3a7; }
  .button-primary, .button-secondary {
    min-height: 48px;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: 900;
  }
  .button-primary { width: 100%; border: 1px solid var(--brand); background: var(--brand); color: #fff; }
  .button-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .button-primary:disabled { cursor: wait; opacity: .65; }
  .button-secondary { margin-top: 14px; border: 1px solid #cbb69c; background: var(--brand-soft); color: var(--ink); }
  .button-link { border: 0; background: transparent; color: var(--brand-dark); font-weight: 900; }
  .form-message { margin: 18px 0 12px; padding: 12px; border-radius: 6px; background: #fbe5df; color: var(--danger); font-weight: 700; }
  .success-view { padding: 52px 28px; text-align: center; }
  .success-view h2 { margin: 14px 0 6px; }
  .success-view p { margin: 0 0 24px; color: var(--muted); }
  .success-mark { display: inline-block; padding: 7px 14px; border-radius: 999px; background: #dcecdf; color: var(--success); font-weight: 900; }

  @media (max-width: 620px) {
    .report-types { grid-template-columns: 1fr; }
    .app-header { width: min(100% - 24px, 760px); padding-top: 18px; }
    .brand-logo { width: 62px; height: 62px; }
    h1 { font-size: 1.55rem; }
    .page-shell { width: 100%; margin-bottom: 0; border-left: 0; border-right: 0; border-radius: 0; }
    form { padding: 4px 18px 24px; }
    .field-grid { grid-template-columns: 1fr; gap: 14px; }
    .equipment-card { align-items: flex-start; }
    .equipment-details { grid-template-columns: 1fr; }
  }
</style>
