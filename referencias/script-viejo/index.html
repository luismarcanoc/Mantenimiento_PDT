<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8"/>
  <title>Reportes Mantenimiento PDT</title>
</head>

<body>
   <h1>FORMULARIO DE REPORTES MANTENIMIENTO</h1>
   <hr/>
   <div>
      <button type="button" id="botonQR" style="background-color: #008CBA; color: white; padding: 12px; font-weight: bold; width: 100%; border: none; border-radius: 5px; cursor: pointer;">
        Escanear Código QR del Equipo
      </button>
    </div>

  <h2>Información preliminar</h2>
  <form id="formReporte">
    <div>
    <label for="nombreOperador">Nombre:</label>
    <input type="text" id="nombreOperador" placeholder="Ingrese su nombre">
    </div>

     <br><div>
      <label for="listaUbicaciones">Seleccione la Ubicación:</label>
      <select id="listaUbicaciones">
        <option value="">-- Click para abrir... --</option>
      </select>
    </div>

    <br> <div>
      <label for="listaAreas">Seleccione el Área:</label>
      <select id="listaAreas" disabled>
        <option value="">-- Seleccione primero una ubicación --</option>
      </select>
    </div>

    <br> <div>
      <label for="areaPersonalizada">Escriba el Área Fuera de Lista:</label>
      <input type="text" id="areaPersonalizada" disabled>
    </div>

    <hr/>
    <h2>Información del equipo</h2>

    <br><div>
      <label for="NombresEquipos">Seleccione el nombre del equipo</label>
      <select id="NombresEquipos" disabled>
      <option value="">-- Termine la información preliminar --</option>
      </select>
    </div>

    <br><div>
      <label for="codigoEquipo">Código de Identificación del Equipo:</label>
      <input type="text" id="codigoEquipo" placeholder="Generando código automáticamente..." readonly>
    </div>

    <br> <div>
      <label for="equipoPersonalizado">Escriba el equipo Fuera de Lista:</label>
      <input type="text" id="equipoPersonalizado" disabled>
    </div>
    
    <hr/>
    <h2>Información final</h2>

    <br><div>
      <label for="descripcionSituacion"> Describa la anomalía presentada:</label>
      <input type="text" id="descripcionSituacion">
    </div>

    <br><div>
      <label for="equipoDetenido">¿El equipo se detuvo o se tiene que detener?</label>
      <select id="equipoDetenido" required>
        <option value="">-- Seleccione una opción --</option>
        <option value="si">SÍ</option>
        <option value="no">NO</option>
      </select>
    </div>
    
    <br><div>
      <label for="evidenciaFoto">Subir foto (Opcional):</label>
      <input type="file" id="evidenciaFoto" accept="image/*,video/*">
    </div>

    <br><br>
    <div>
      <button type="submit" id="botonEnviar" style="background-color: #4CAF50; color: white; padding: 15px; font-size: 18px; font-weight: bold; width: 100%; border: none; border-radius: 5px; cursor: pointer;">
        Enviar Reporte
      </button>
    </div>
</body>

</html>
