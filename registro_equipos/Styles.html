<style>
  :root{font-family:Inter,Arial,sans-serif;color:#231b16;background:#f6f1e9;line-height:1.45}*{box-sizing:border-box}body{margin:0}header{background:#2f2119;color:#fff;padding:32px 20px}header>div,main{max-width:920px;margin:auto}.eyebrow{color:#efbd7a;font-size:.78rem;font-weight:800;letter-spacing:.14em}h1{margin:4px 0 6px;font-size:2rem}header p{margin:0;color:#eadfd7}main{padding:24px 16px 50px}.panel{background:#fff;border:1px solid #dfd4c8;border-radius:16px;padding:24px;box-shadow:0 8px 26px rgba(53,34,20,.07)}h2{font-size:1.1rem;margin:6px 0 16px}.user-line{font-size:.86rem;color:#695a50;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}.wide{grid-column:1/-1}label{display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:.9rem}input,select,textarea{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid #bba99a;border-radius:9px;padding:12px}input:focus,select:focus,textarea:focus{outline:3px solid #f5d9b5;border-color:#a76128}.preview{border:1px solid #d7b78d;background:#fff8ef;border-radius:12px;padding:16px;margin:4px 0 26px;display:flex;flex-direction:column;gap:4px}.preview span,.preview small{color:#746258}.preview strong,.final-code{font-size:1.35rem;letter-spacing:.06em}.message{min-height:24px;color:#a23a2b}.error{border-color:#d89688;background:#fff7f5}.success{text-align:center}.success a{display:block;margin:16px 0;color:#8b4d1d}.status{text-align:center;color:#695a50}button{border:0;border-radius:10px;background:#9c5724;color:#fff;font:inherit;font-weight:800;padding:13px 20px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#eee3d8;color:#492f1d}#another{margin-top:8px}@media(max-width:640px){header{padding:24px 16px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:18px}}
